[package]
name = "metriccupid-push"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Self-hostable server for MetricCupid: signed Pushover relay (v1) and end-to-end encrypted Mac <-> iPhone mailbox with APNs (v2)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dzaczek/metriccupid-push"
readme = "README.md"
publish = false

[[bin]]
name = "metriccupid-push"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "tracing", "query", "form", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tower = { version = "0.5", default-features = false, features = ["limit"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "http2"] }
governor = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "ansi"] }
ipnet = "2"
base64 = "0.22"
# Already in the tree via rustls; used directly for the APNs ES256 provider token.
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
# App Store licences: the AppTransaction x5c chain (signatures checked with ring).
x509-parser = { version = "0.18", default-features = false }
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }

[dev-dependencies]
wiremock = "0.6"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# Apple-like test certificate chains for licence tests.
rcgen = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
