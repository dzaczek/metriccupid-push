[package]
name = "metriccupid-push"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Self-hostable, signed HTTP relay from the MetricCupid macOS app to the Pushover API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dzaczek/metriccupid-push"
readme = "README.md"
publish = false

[[bin]]
name = "metriccupid-push"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "tracing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
tower = { version = "0.5", default-features = false, features = ["limit"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
governor = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "ansi"] }
ipnet = "2"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
